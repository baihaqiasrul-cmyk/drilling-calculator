<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hydrostatic Pressure Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #eef6ff;
            border-radius: 10px;
            text-align: center;
        }

        .pressure {
            font-size: 30px;
            font-weight: bold;
            margin-top: 10px;
        }

        .formula {
            margin-top: 15px;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Hydrostatic Pressure</h1>

    <div class="subtitle">
        Drilling Calculator v1.0
    </div>

    <label for="mudWeight">
        Mud Weight (ppg)
    </label>

    <input
        type="number"
        id="mudWeight"
        placeholder="Contoh: 10"
        step="0.01"
    >

    <label for="tvd">
        TVD (ft)
    </label>

    <input
        type="number"
        id="tvd"
        placeholder="Contoh: 5000"
        step="0.1"
    >

    <button onclick="calculatePressure()">
        CALCULATE
    </button>

    <div class="result">

        <div>Hydrostatic Pressure</div>

        <div class="pressure" id="result">
            0 psi
        </div>

        <div class="formula">
            P = 0.052 × MW × TVD
        </div>

    </div>

</div>

<script>

function calculatePressure() {

    // Ambil nilai dari input
    let mudWeight = parseFloat(
        document.getElementById("mudWeight").value
    );

    let tvd = parseFloat(
        document.getElementById("tvd").value
    );

    // Cek apakah input kosong
    if (isNaN(mudWeight) || isNaN(tvd)) {

        document.getElementById("result").innerHTML =
            "Masukkan nilai dulu bro!";

        return;
    }

    // Rumus hydrostatic pressure
    let pressure = 0.052 * mudWeight * tvd;

    // Tampilkan hasil
    document.getElementById("result").innerHTML =
        pressure.toFixed(2) + " psi";
}

</script>

</body>
</html>
